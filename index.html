<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexChat | 연결, 그 이상의 가치</title>
    <style>
        /* 기본 스타일 초기화 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { line-height: 1.6; color: #333; overflow-x: hidden; }

        /* 헤더 */
        header { padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); z-index: 1000; }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4F46E5; }
        .btn-download { background: #4F46E5; color: white; padding: 10px 20px; border-radius: 25px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-download:hover { background: #3730A3; }

        /* 히어로 섹션 */
        .hero { height: 100 vertical-height; padding: 150px 10% 100px; display: flex; align-items: center; background: linear-gradient(135deg, #F5F7FF 0%, #FFFFFF 100%); }
        .hero-text { flex: 1; }
        .hero-text h1 { font-size: 3.5rem; line-height: 1.2; margin-bottom: 20px; }
        .hero-text p { font-size: 1.2rem; color: #666; margin-bottom: 30px; }
        .hero-image { flex: 1; text-align: right; }
        .mockup { width: 300px; height: 600px; background: #333; border-radius: 40px; border: 8px solid #111; display: inline-block; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .mockup::after { content: "NexChat Screen"; color: white; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 0.8rem; }

        /* 특징 섹션 */
        .features { padding: 100px 10%; background: white; text-align: center; }
        .features h2 { margin-bottom: 50px; font-size: 2.5rem; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
        .card { padding: 40px; border-radius: 20px; background: #F9FAFB; transition: transform 0.3s; }
        .card:hover { transform: translateY(-10px); }
        .card h3 { margin-bottom: 15px; color: #4F46E5; }

        /* 푸터 */
        footer { padding: 50px 10%; background: #1F2937; color: white; text-align: center; }

        /* 반응형 */
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; padding-top: 120px; }
            .hero-image { margin-top: 50px; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NexChat</div>
        <a href="#" class="btn-download">앱 설치하기</a>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>세상의 모든 대화가<br><strong>더 자유로워집니다</strong></h1>
            <p>보안은 강력하게, 인터페이스는 가볍게.<br>NexChat으로 소중한 사람들과 끊김 없이 소통하세요.</p>
            <div class="btns">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Play Store" height="50">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store" height="50">
            </div>
        </div>
        <div class="hero-image">
            <div class="mockup"></div>
        </div>
    </section>

    <section class="features">
        <h2>왜 NexChat 인가요?</h2>
        <div class="grid">
            <div class="card">
                <h3>🔒 종단간 암호화</h3>
                <p>당신의 대화는 오직 당신과 대화 상대만 읽을 수 있습니다.</p>
            </div>
            <div class="card">
                <h3>⚡ 초고속 전송</h3>
                <p>대용량 파일과 고화질 사진도 순식간에 공유하세요.</p>
            </div>
            <div class="card">
                <h3>🎨 커스텀 테마</h3>
                <p>나만의 감성으로 채팅창을 자유롭게 꾸며보세요.</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 NexChat Inc. All rights reserved.</p>
    </footer>

</body>
</html>
